description: Layer-aware pointing gesture input processor

compatible: "zmk,input-processor-gesture"

include: ip_zero_param.yaml

properties:
  layer:
    type: int
    required: true
    description: Layer ID on which the processor consumes relative X/Y input

  threshold:
    type: int
    required: true
    description: Manhattan distance required to recognize one gesture

  cooldown-ms:
    type: int
    required: true
    description: Motion discard interval after a direction is recognized

  reset-on-layer:
    type: int
    required: true
    description: Additional mutually exclusive layer whose transitions reset accumulated motion

  binding-layer:
    type: int
    required: true
    description: Keymap layer containing the editable gesture action slots

  left-position:
    type: int
    required: true
    description: Key position to invoke for a left gesture

  right-position:
    type: int
    required: true
    description: Key position to invoke for a right gesture
