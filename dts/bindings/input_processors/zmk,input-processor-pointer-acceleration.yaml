description: Vector-speed pointer acceleration input processor

compatible: "zmk,input-processor-pointer-acceleration"

include: ip_zero_param.yaml

properties:
  base-multiplier-milli:
    type: int
    required: true
    description: Linear low-speed gain in thousandths, where 1000 means 1.0x

  takeoff-speed:
    type: int
    required: true
    description: Vector counts per completed report at or below which gain is exactly 1.0x

  full-speed:
    type: int
    required: true
    description: Vector counts per completed report at or above which maximum gain is used

  max-multiplier-milli:
    type: int
    required: true
    description: Maximum pointer gain in thousandths, where 2250 means 2.25x

  attack-smoothing-milli:
    type: int
    required: true
    description: Fraction of a gain increase applied per report, in thousandths

  release-smoothing-milli:
    type: int
    required: true
    description: Fraction of a gain decrease applied per report, in thousandths

  reference-interval-ms:
    type: int
    required: true
    description: Report interval used to normalize vector speed

  idle-reset-ms:
    type: int
    required: true
    description: Idle duration after which the next report starts at base gain
