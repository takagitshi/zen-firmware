name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  verify-dya-contract:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts
      - name: Verify DYA Studio firmware contract
        run: >-
          python3 scripts/verify-dya-build.py
          --firmware artifacts/zen_right_trackball_pmw3610_central.uf2
